[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mimicry"
version = "0.1.0"
description = "Rewrite AI drafts in your own voice with a bounded TypeSafe feedback loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.0,<2",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "marimo>=0.24,<1",
    "twitter-text-parser>=3,<4",
    # twitter-text-parser 3.0 loads emoji data through pkg_resources.
    "setuptools>=80,<82",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
mimicry = "mimicry.cli:main"
mimicry-web = "mimicry.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mimicry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
